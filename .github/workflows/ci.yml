name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: pip install -r requirements.txt pytest
      - name: Unit tests
        env:
          PYTHONPATH: .
        run: pytest -q
      - name: Import poller package
        env:
          PYTHONPATH: .
        run: python -c "from poller.config import Settings; print(Settings.from_env().sweep_interval_seconds)"
