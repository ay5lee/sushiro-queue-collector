# Build and push the poller image to GitHub Container Registry (GHCR).
#
# Publishes: ghcr.io/ay5lee/sushiro-queue-collector:<tag>
# Auth: GITHUB_TOKEN with packages: write (default for Actions on this repo).
#
# Triggers: push to main, version tags (v*), and manual workflow_dispatch.
#
# Package visibility: first publish often creates a *private* GHCR package even
# when the repo is public. After the first successful run, set the package to
# Public under GitHub → Packages → sushiro-queue-collector → Package settings
# if Portainer (or others) should pull without a PAT.

name: docker-publish

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

env:
  IMAGE_NAME: sushiro-queue-collector

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set image name
        id: meta_name
        run: |
          if [ -n "${IMAGE_NAME}" ]; then
            echo "image=${IMAGE_NAME}" >> "$GITHUB_OUTPUT"
          else
            echo "image=${GITHUB_REPOSITORY##*/}" >> "$GITHUB_OUTPUT"
          fi

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ steps.meta_name.outputs.image }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
