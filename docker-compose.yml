# Local development stack (builds the poller from this directory).
# Optional: cp .env.example .env for overrides (Compose interpolates .env;
# there is no env_file: — so Portainer/GitOps will not require a .env file).
# Portainer / GHCR: use deploy/portainer-stack.yml → ghcr.io/ay5lee/sushiro-queue-collector

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-sushiro}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sushiro}
      POSTGRES_DB: ${POSTGRES_DB:-sushiro_queue}
    ports:
      - "5432:5432"
    volumes:
      - sushiro_pgdata:/var/lib/postgresql/data
      - ./sql/001_schema.sql:/docker-entrypoint-initdb.d/001_schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-sushiro} -d ${POSTGRES_DB:-sushiro_queue}"]
      interval: 5s
      timeout: 5s
      retries: 10

  poller:
    build: .
    image: sushiro-queue-collector:local
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://sushiro:sushiro@db:5432/sushiro_queue}
      SWEEP_INTERVAL_SECONDS: ${SWEEP_INTERVAL_SECONDS:-60}
      CONCURRENCY: ${CONCURRENCY:-4}
      DEFAULT_OPEN_TIME: ${DEFAULT_OPEN_TIME:-10:30}
      DEFAULT_CLOSE_TIME: ${DEFAULT_CLOSE_TIME:-22:00}
      FORCE_POLL: ${FORCE_POLL:-0}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      LOG_JSON: ${LOG_JSON:-1}
      STORE_HOURS_JSON: ${STORE_HOURS_JSON:-}
      MAX_REQUESTS_PER_MINUTE: ${MAX_REQUESTS_PER_MINUTE:-90}
      STORE_SYNC_INTERVAL_SECONDS: ${STORE_SYNC_INTERVAL_SECONDS:-21600}
    restart: unless-stopped

volumes:
  sushiro_pgdata:
