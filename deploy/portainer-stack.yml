# Portainer stack — pulls the poller image from GHCR.
#
# Image: ghcr.io/ay5lee/sushiro-queue-collector:latest
# Repo:  https://github.com/ay5lee/sushiro-queue-collector
#
# GitOps / Portainer:
# 1. Stack → Repository. Compose path MUST be: deploy/portainer-stack.yml
#    (do not use root docker-compose.yml — that is for local Mac builds only).
# 2. Do NOT rely on a checked-in .env and do NOT add env_file: .env here.
#    Set stack environment variables in the Portainer UI from
#    deploy/portainer.env.example (at least POSTGRES_PASSWORD + DATABASE_URL).
# 3. If the GHCR package is private, add a Portainer registry credential for
#    ghcr.io (GitHub PAT with read:packages) and assign it to the stack.
#
# Local Mac development still uses ../docker-compose.yml (build: .).

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-sushiro}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sushiro}
      POSTGRES_DB: ${POSTGRES_DB:-sushiro_queue}
    volumes:
      - sushiro_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-sushiro} -d ${POSTGRES_DB:-sushiro_queue}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  poller:
    image: ghcr.io/ay5lee/sushiro-queue-collector:latest
    depends_on:
      db:
        condition: service_healthy
    # All knobs via compose environment + Portainer stack env (no env_file).
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://sushiro:sushiro@db:5432/sushiro_queue}
      SWEEP_INTERVAL_SECONDS: ${SWEEP_INTERVAL_SECONDS:-60}
      CONCURRENCY: ${CONCURRENCY:-4}
      DEFAULT_OPEN_TIME: ${DEFAULT_OPEN_TIME:-10:30}
      DEFAULT_CLOSE_TIME: ${DEFAULT_CLOSE_TIME:-22:00}
      FORCE_POLL: ${FORCE_POLL:-0}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      LOG_JSON: ${LOG_JSON:-1}
      STORE_HOURS_JSON: ${STORE_HOURS_JSON:-}
      MAX_REQUESTS_PER_MINUTE: ${MAX_REQUESTS_PER_MINUTE:-90}
      STORE_SYNC_INTERVAL_SECONDS: ${STORE_SYNC_INTERVAL_SECONDS:-21600}
    restart: unless-stopped

volumes:
  sushiro_pgdata:
