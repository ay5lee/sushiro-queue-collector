# Portainer stack — pulls the poller image from GHCR + Postgres.
#
# Deploy:
# 1. In Portainer: Stacks → Add stack → Web editor (paste this file) or upload.
# 2. Set env vars from deploy/portainer.env.example (change POSTGRES_PASSWORD).
# 3. If the GHCR package is still private, add a Portainer registry for ghcr.io
#    (GitHub PAT with read:packages) and assign it to this stack.
# 4. Deploy. Poller applies sql/001_schema.sql on startup.
#
# Image: ghcr.io/ay5lee/sushiro-queue-collector:latest
# Local Mac development still uses ../docker-compose.yml (build: .).

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-sushiro}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sushiro}
      POSTGRES_DB: ${POSTGRES_DB:-sushiro_queue}
    volumes:
      - sushiro_pgdata:/var/lib/postgresql/data
      # Schema is also applied by the poller on startup; optional init mount:
      # - ./sql/001_schema.sql:/docker-entrypoint-initdb.d/001_schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-sushiro} -d ${POSTGRES_DB:-sushiro_queue}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  poller:
    image: ghcr.io/ay5lee/sushiro-queue-collector:latest
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://sushiro:sushiro@db:5432/sushiro_queue}
      SWEEP_INTERVAL_SECONDS: ${SWEEP_INTERVAL_SECONDS:-60}
      CONCURRENCY: ${CONCURRENCY:-4}
      DEFAULT_OPEN_TIME: ${DEFAULT_OPEN_TIME:-10:30}
      DEFAULT_CLOSE_TIME: ${DEFAULT_CLOSE_TIME:-22:00}
      FORCE_POLL: ${FORCE_POLL:-0}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      LOG_JSON: ${LOG_JSON:-1}
      STORE_HOURS_JSON: ${STORE_HOURS_JSON:-}
    restart: unless-stopped

volumes:
  sushiro_pgdata:
